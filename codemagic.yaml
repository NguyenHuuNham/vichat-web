workflows:
  ios-build-ipa:
    name: ViChat iOS Build IPA
    max_build_duration: 120
    instance_type: mac_mini_m1
    working_directory: mobile
    environment:
      node: latest
      xcode: latest
      vars:
        CI: "1"
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Prepare Expo environment
        script: cp .env.example .env
      - name: Generate iOS native project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Strip Push Notifications entitlement for test build
        script: |
          ENTITLEMENTS="$(find ios -name '*.entitlements' -print -quit)"
          if [ -n "$ENTITLEMENTS" ]; then
            echo "Adjusting $ENTITLEMENTS for standalone IPA..."
            plutil -remove aps-environment "$ENTITLEMENTS" 2>/dev/null || true
          fi
      - name: Build IPA
        script: |
          IOS_WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$IOS_WORKSPACE"
          IOS_SCHEME="$(basename "$IOS_WORKSPACE" .xcworkspace)"
          echo "Building unsigned Release app with scheme: $IOS_SCHEME..."
          xcodebuild build \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual

          echo "Packaging into ViChat.ipa..."
          mkdir -p build/ios/ipa/Payload
          APP_PATH="$(find build/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr ViChat.ipa Payload
          rm -rf Payload
          echo "Build completed successfully! ViChat.ipa generated in build/ios/ipa/"
    artifacts:
      - build/ios/ipa/*.ipa

  android-test:
    name: ViChat Android test APK
    max_build_duration: 90
    instance_type: linux
    working_directory: mobile
    environment:
      node: latest
      java: 17
      vars:
        CI: "1"
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Prepare Expo environment
        script: cp .env.example .env
      - name: Generate Android native project
        script: npx expo prebuild --platform android --no-install
      - name: Build release APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
