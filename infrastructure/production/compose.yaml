name: songhong-production

services:
  tinode-postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TINODE_DB_PASSWORD:?TINODE_DB_PASSWORD is required}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tinode"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - tinode_postgres_data:/var/lib/postgresql/data

  chatapi:
    image: tinode/tinode-postgres:0.25.3@sha256:0df104ad2a96438b7581f71168518ffa103d0c9a5ec6ce2db6ef8649bd9e0ca5
    restart: unless-stopped
    depends_on:
      tinode-postgres:
        condition: service_healthy
    expose:
      - "6060"
    environment:
      POSTGRES_DSN: postgresql://postgres:${TINODE_DB_PASSWORD}@tinode-postgres:5432/tinode?sslmode=disable&connect_timeout=10
      WAIT_FOR: tinode-postgres:5432
      AUTH_TOKEN_KEY: ${TINODE_AUTH_TOKEN_KEY:?TINODE_AUTH_TOKEN_KEY is required}
      AUTH_TOKEN_EXPIRE_IN: ${TINODE_TOKEN_EXPIRE_IN:-300}
      UID_ENCRYPTION_KEY: ${TINODE_UID_ENCRYPTION_KEY:?TINODE_UID_ENCRYPTION_KEY is required}
      SAMPLE_DATA: /data/tinode-bootstrap.json
      UPGRADE_DB: "${TINODE_UPGRADE_DB:-false}"
      ACC_GC_ENABLED: "true"
      DEBUG_EMAIL_VERIFICATION_CODE: ""
      FS_CORS_ORIGINS: '${TINODE_CORS_ORIGINS}'
      WEBRTC_ENABLED: "${WEBRTC_ENABLED:-false}"
      ICE_SERVERS_FILE: /data/runtime/ice-servers.json
    volumes:
      - ../tinode/config.template:/opt/tinode/config.template:ro
      - ./runtime/tinode-bootstrap.json:/data/tinode-bootstrap.json:ro
      - ./runtime:/data/runtime:ro
      - tinode_uploads:/opt/tinode/uploads
      - tinode_botdata:/botdata

  coturn:
    image: coturn/coturn:4.16.0@sha256:01fc8655e7c262fa4ccfb8dca74ff80fb372b0ee021e80370a4d3e3dd01a951e
    profiles: [webrtc]
    restart: unless-stopped
    network_mode: host
    command:
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-chat.upgo.vn}
      - --user=${TURN_USERNAME:-vichat}:${TURN_PASSWORD:-disabled}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --listening-ip=${TURN_PRIVATE_IP:-127.0.0.1}
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --relay-ip=${TURN_PRIVATE_IP:-127.0.0.1}
      - --no-multicast-peers
      - --log-file=stdout

  chat-postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHATSERVICE_DB_NAME:-chatservice}
      POSTGRES_USER: ${CHATSERVICE_DB_USER:-chatservice}
      POSTGRES_PASSWORD: ${CHATSERVICE_DB_PASSWORD:?CHATSERVICE_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHATSERVICE_DB_USER:-chatservice} -d ${CHATSERVICE_DB_NAME:-chatservice}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - chatservice_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatservice_redis_data:/data

  chatmgt:
    build:
      context: ../..
      dockerfile: infrastructure/production/Dockerfile.chatmgt
      args:
        VITE_CHAT_TENANT_ID: ${CHATMGT_DEFAULT_TENANT:-tn6913580727957397}
    restart: unless-stopped
    depends_on:
      chat-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chatapi:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8093"
    ports:
      - "${CHATMGT_BIND_HOST:-0.0.0.0}:${CHATMGT_PUBLIC_PORT:-8081}:8093"
    volumes:
      - ../../chatservice-main/knowledge:/app/knowledge:ro
      - ./tinode-bootstrap.template.json:/app/deploy/tinode-bootstrap.template.json:ro
      - ./runtime:/app/deploy/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/api/v1/auth/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      ENVIRONMENT: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8093
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      AUTH_PASSWORD_SALT: ${AUTH_PASSWORD_SALT:?AUTH_PASSWORD_SALT is required}
      SESSION_COOKIE_SALT: ${SESSION_COOKIE_SALT:?SESSION_COOKIE_SALT is required}
      SQLALCHEMY_DATABASE_URI: postgresql://${CHATSERVICE_DB_USER:-chatservice}:${CHATSERVICE_DB_PASSWORD}@chat-postgres:5432/${CHATSERVICE_DB_NAME:-chatservice}
      REDIS_ADDR: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ACCOUNT_URL: ${ACCOUNT_URL:-}
      ACCOUNT_SSO_LOGIN_PATH: ${ACCOUNT_SSO_LOGIN_PATH:-/login}
      ACCOUNT_SSO_PROFILE_PATH: ${ACCOUNT_SSO_PROFILE_PATH:-/current_user}
      ACCOUNT_SSO_DIRECTORY_PATH: ${ACCOUNT_SSO_DIRECTORY_PATH:-/api/v1/tenant_user}
      ACCOUNT_SSO_LOGOUT_PATH: ${ACCOUNT_SSO_LOGOUT_PATH:-/logout}
      ACCOUNT_SSO_SELF_PROFILE_PATH: ${ACCOUNT_SSO_SELF_PROFILE_PATH:-/me}
      ACCOUNT_SSO_USER_UPDATE_PATH: ${ACCOUNT_SSO_USER_UPDATE_PATH:-/api/v1/user}
      ACCOUNT_AVATAR_UPLOAD_URL: ${ACCOUNT_AVATAR_UPLOAD_URL:-https://service.upgo.vn/api/image/upload?path=accounts}
      ACCOUNT_SSO_TIMEOUT: ${ACCOUNT_SSO_TIMEOUT:-10}
      ACCOUNT_SESSION_COOKIE_NAME: ${ACCOUNT_SESSION_COOKIE_NAME:-session}
      ACCOUNT_SESSION_COOKIE_DOMAIN: ${ACCOUNT_SESSION_COOKIE_DOMAIN:-.upgo.vn}
      ACCOUNT_SESSION_COOKIE_SECURE: ${ACCOUNT_SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-chatmgt.upgo.vn}
      CHATMGT_DEFAULT_TENANT: ${CHATMGT_DEFAULT_TENANT:-tn6913580727957397}
      CHAT_AUTH_JWT_SECRET: ${CHAT_AUTH_JWT_SECRET:?CHAT_AUTH_JWT_SECRET is required}
      CHAT_CORS_ORIGINS: '${CHAT_CORS_ORIGINS:-["http://127.0.0.1:5173"]}'
      CHAT_AUTH_ACCESS_TTL: ${CHAT_AUTH_ACCESS_TTL:-28800}
      CHAT_MOBILE_BEARER_ENABLED: ${CHAT_MOBILE_BEARER_ENABLED:-true}
      CHAT_AUTH_COOKIE_SECURE: ${CHAT_AUTH_COOKIE_SECURE:-false}
      CHAT_AUTH_MAX_FAILURES: ${CHAT_AUTH_MAX_FAILURES:-5}
      CHAT_AUTH_FAILURE_WINDOW: ${CHAT_AUTH_FAILURE_WINDOW:-900}
      CHAT_PASSWORD_RESET_TTL: ${CHAT_PASSWORD_RESET_TTL:-1800}
      CHAT_PASSWORD_RESET_MAX_REQUESTS: ${CHAT_PASSWORD_RESET_MAX_REQUESTS:-3}
      CHAT_PASSWORD_RESET_WINDOW: ${CHAT_PASSWORD_RESET_WINDOW:-900}
      CHAT_PASSWORD_RESET_URL: ${CHAT_PASSWORD_RESET_URL:?CHAT_PASSWORD_RESET_URL is required}
      CHAT_PASSWORD_RESET_DEBUG: ${CHAT_PASSWORD_RESET_DEBUG:-false}
      CHAT_SMTP_HOST: ${CHAT_SMTP_HOST:-}
      CHAT_SMTP_PORT: ${CHAT_SMTP_PORT:-587}
      CHAT_SMTP_USERNAME: ${CHAT_SMTP_USERNAME:-}
      CHAT_SMTP_PASSWORD: ${CHAT_SMTP_PASSWORD:-}
      CHAT_SMTP_FROM: ${CHAT_SMTP_FROM:-}
      CHAT_SMTP_STARTTLS: ${CHAT_SMTP_STARTTLS:-true}
      CHAT_SMTP_SSL: ${CHAT_SMTP_SSL:-false}
      # Chatmgt reaches the central Tinode through the ChatUI Nginx relay.
      # This keeps the browser and server-side bridge on one authoritative
      # Tinode endpoint while the old ChatAPI remains available for rollback.
      TINODE_INTERNAL_WS_URL: ${TINODE_INTERNAL_WS_URL:-ws://chat:80/v0/channels}
      TINODE_API_KEY: ${TINODE_API_KEY:?TINODE_API_KEY is required}
      TINODE_AUTH_TIMEOUT: ${TINODE_AUTH_TIMEOUT:-10}
      TINODE_CENTRAL_TOKEN_MAX_TTL: ${TINODE_CENTRAL_TOKEN_MAX_TTL:-1209600}
      TINODE_ADMIN_USERNAME: ${TINODE_ADMIN_USERNAME:-}
      TINODE_ADMIN_PASSWORD: ${TINODE_ADMIN_PASSWORD:-}
      TINODE_SSO_SECRET: ${TINODE_SSO_SECRET:?TINODE_SSO_SECRET is required}
      TINODE_BRIDGE_INTERNAL_KEY: ${TINODE_BRIDGE_INTERNAL_KEY:?TINODE_BRIDGE_INTERNAL_KEY is required}
      CHAT_ACCOUNT_SSO_ENABLED: ${CHAT_ACCOUNT_SSO_ENABLED:-true}
      CHAT_ACCOUNT_CREDENTIAL_LOGIN_ENABLED: ${CHAT_ACCOUNT_CREDENTIAL_LOGIN_ENABLED:-true}
      ACCOUNT_SSO_DIRECTORY_SYNC_TTL: ${ACCOUNT_SSO_DIRECTORY_SYNC_TTL:-10}
      TINODE_MIRROR_LOCAL_CREDENTIALS: ${TINODE_MIRROR_LOCAL_CREDENTIALS:-true}
      CHATMGT_ADMIN_ACCOUNT_SSO_ENABLED: ${CHATMGT_ADMIN_ACCOUNT_SSO_ENABLED:-true}
      CHATMGT_BOOTSTRAP_ADMIN_FULL_NAME: ${CHATMGT_BOOTSTRAP_ADMIN_FULL_NAME:-VICHAT Administrator}
      CHATMGT_BOOTSTRAP_ADMIN_EMAIL: ${CHATMGT_BOOTSTRAP_ADMIN_EMAIL:-admin@chat.upgo.vn}
      CHATBOT_ENABLED: ${CHATBOT_ENABLED:-true}
      CHATBOT_REQUIRE_AUTH: ${CHATBOT_REQUIRE_AUTH:-true}
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-external-webhook}
      CHATBOT_API_URL: ${CHATBOT_API_URL:-https://knowledge.gonapp.net/api/v1/chat}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:-}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-}
      CHATBOT_EXTERNAL_AUTH_HEADER: ${CHATBOT_EXTERNAL_AUTH_HEADER:-Authorization}
      CHATBOT_EXTERNAL_AUTH_SCHEME: ${CHATBOT_EXTERNAL_AUTH_SCHEME:-Bearer}
      CHATBOT_EXTERNAL_API_KEY: ${CHATBOT_EXTERNAL_API_KEY:-}
      CHATBOT_EXTERNAL_TENANT: ${CHATBOT_EXTERNAL_TENANT:-}
      CHATBOT_EXTERNAL_KNOWLEDGE_BASE_ID: ${CHATBOT_EXTERNAL_KNOWLEDGE_BASE_ID:-}
      TINODE_CHATBOT_ENABLED: ${TINODE_CHATBOT_ENABLED:-false}
      TINODE_CHATBOT_USERNAME: ${TINODE_CHATBOT_USERNAME:-upgo_chatbot}
      TINODE_CHATBOT_PASSWORD: ${TINODE_CHATBOT_PASSWORD:-}
      TINODE_CHATBOT_DISPLAY_NAME: ${TINODE_CHATBOT_DISPLAY_NAME:-ViChat AI}
      TINODE_CHATBOT_DISPLAY_TITLE: ${TINODE_CHATBOT_DISPLAY_TITLE:-Tro ly AI}
      TINODE_CHATBOT_DISPLAY_ORGANIZATION: ${TINODE_CHATBOT_DISPLAY_ORGANIZATION:-GON Platform}
      TINODE_CHATBOT_DISPLAY_AVATAR: ${TINODE_CHATBOT_DISPLAY_AVATAR:-/favicon.svg}
      TINODE_CHATBOT_WEBHOOK_KEY: ${TINODE_CHATBOT_WEBHOOK_KEY:-}
      TINODE_CHATBOT_WEBHOOK_URL: ${TINODE_CHATBOT_WEBHOOK_URL:-http://chatmgt:8093/api/v1/chatbot/tinode-webhook}
      TINODE_CHATBOT_WEBHOOK_TIMEOUT: ${TINODE_CHATBOT_WEBHOOK_TIMEOUT:-40}
      TINODE_CHATBOT_HISTORY_LIMIT: ${TINODE_CHATBOT_HISTORY_LIMIT:-100}
      TINODE_CHATBOT_FAILURE_REPLY: ${TINODE_CHATBOT_FAILURE_REPLY:-Tro ly AI dang tam thoi khong phan hoi. Vui long thu lai sau.}
      CHATBOT_TIMEOUT: ${CHATBOT_TIMEOUT:-30}
      CHATBOT_TEMPERATURE: ${CHATBOT_TEMPERATURE:-0.2}
      CHATBOT_MAX_TOKENS: ${CHATBOT_MAX_TOKENS:-800}
      CHATBOT_MAX_INPUT_LENGTH: ${CHATBOT_MAX_INPUT_LENGTH:-4000}
      CHATBOT_DEFAULT_TENANT: ${CHATBOT_DEFAULT_TENANT:-tn6913580727957397}
      CHATBOT_KNOWLEDGE_ONLY: ${CHATBOT_KNOWLEDGE_ONLY:-false}
      CHATBOT_KNOWLEDGE_REQUIRE_AUTH: ${CHATBOT_KNOWLEDGE_REQUIRE_AUTH:-true}
      CHATBOT_RETRIEVAL_LIMIT: ${CHATBOT_RETRIEVAL_LIMIT:-6}
      CHATBOT_RETRIEVAL_CANDIDATES: ${CHATBOT_RETRIEVAL_CANDIDATES:-500}
      CHATBOT_CHUNK_SIZE: ${CHATBOT_CHUNK_SIZE:-1400}
      CHATBOT_CHUNK_OVERLAP: ${CHATBOT_CHUNK_OVERLAP:-180}
      CHATBOT_MAX_KNOWLEDGE_FILE_SIZE: ${CHATBOT_MAX_KNOWLEDGE_FILE_SIZE:-20971520}

  tinode-account-bridge:
    build:
      context: ../..
      dockerfile: infrastructure/production/Dockerfile.chatmgt
      args:
        VITE_CHAT_TENANT_ID: ${CHATMGT_DEFAULT_TENANT:-tn6913580727957397}
    restart: unless-stopped
    depends_on:
      chatmgt:
        condition: service_healthy
    expose:
      - "8095"
    command: ["python", "scripts/tinode_account_bridge.py"]
    volumes:
      - ./runtime:/app/deploy/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      TINODE_BRIDGE_HOST: 0.0.0.0
      TINODE_BRIDGE_PORT: 8095
      TINODE_BRIDGE_TIMEOUT: ${TINODE_BRIDGE_TIMEOUT:-15}
      CHATMGT_INTERNAL_URL: http://chatmgt:8093
      CHATMGT_DEFAULT_TENANT: ${CHATMGT_DEFAULT_TENANT:-tn6913580727957397}
      ACCOUNT_SESSION_COOKIE_NAME: ${ACCOUNT_SESSION_COOKIE_NAME:-session}
      CHAT_ACCESS_COOKIE_NAME: vichat_access_token
      TINODE_API_KEY: ${TINODE_API_KEY:?TINODE_API_KEY is required}
      TINODE_CENTRAL_WS_URL: ${TINODE_CENTRAL_WS_URL:-wss://web.vichat.net/v0/channels}
      TINODE_BRIDGE_INTERNAL_KEY: ${TINODE_BRIDGE_INTERNAL_KEY:?TINODE_BRIDGE_INTERNAL_KEY is required}
      TINODE_BRIDGE_ICE_SERVERS_FILE: /app/deploy/runtime/ice-servers.json

  tinode-chatbot-webhook:
    build:
      context: ../..
      dockerfile: infrastructure/production/Dockerfile.chatmgt
      args:
        VITE_CHAT_TENANT_ID: ${CHATMGT_DEFAULT_TENANT:-tn6913580727957397}
    restart: unless-stopped
    depends_on:
      chatmgt:
        condition: service_healthy
      chat:
        condition: service_healthy
    expose:
      - "8096"
    command: ["python", "scripts/tinode_chatbot_webhook.py"]
    volumes:
      - tinode_chatbot_state:/var/lib/vichat-chatbot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    environment:
      ENVIRONMENT: production
      TINODE_CHATBOT_HOST: 0.0.0.0
      TINODE_CHATBOT_PORT: 8096
      TINODE_CHATBOT_ENABLED: ${TINODE_CHATBOT_ENABLED:-false}
      TINODE_CHATBOT_USERNAME: ${TINODE_CHATBOT_USERNAME:-upgo_chatbot}
      TINODE_CHATBOT_PASSWORD: ${TINODE_CHATBOT_PASSWORD:-}
      TINODE_CHATBOT_WEBHOOK_KEY: ${TINODE_CHATBOT_WEBHOOK_KEY:-}
      TINODE_CHATBOT_WEBHOOK_URL: ${TINODE_CHATBOT_WEBHOOK_URL:-http://chatmgt:8093/api/v1/chatbot/tinode-webhook}
      TINODE_CHATBOT_WEBHOOK_TIMEOUT: ${TINODE_CHATBOT_WEBHOOK_TIMEOUT:-40}
      TINODE_CHATBOT_HISTORY_LIMIT: ${TINODE_CHATBOT_HISTORY_LIMIT:-100}
      TINODE_CHATBOT_STATE_FILE: /var/lib/vichat-chatbot/state.json
      TINODE_CHATBOT_FAILURE_REPLY: ${TINODE_CHATBOT_FAILURE_REPLY:-Tro ly AI dang tam thoi khong phan hoi. Vui long thu lai sau.}
      TINODE_INTERNAL_WS_URL: ${TINODE_INTERNAL_WS_URL:-ws://chat:80/v0/channels}
      TINODE_API_KEY: ${TINODE_API_KEY:?TINODE_API_KEY is required}
      TINODE_AUTH_TIMEOUT: ${TINODE_AUTH_TIMEOUT:-10}
      TINODE_BRIDGE_INTERNAL_KEY: ${TINODE_BRIDGE_INTERNAL_KEY:?TINODE_BRIDGE_INTERNAL_KEY is required}

  chat:
    build:
      context: ../..
      dockerfile: infrastructure/production/Dockerfile
      args:
        VITE_TINODE_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
        VITE_TINODE_API_KEY: ${TINODE_API_KEY:?TINODE_API_KEY is required}
        VITE_TINODE_SECURE: ${PUBLIC_SECURE:-false}
        VITE_TINODE_TRANSPORT: ws
        VITE_TINODE_PERSIST: "false"
        VITE_TINODE_APP_NAME: SONGHONG/1.0
        VITE_CHATBOT_API_URL: "${CHAT_MANAGEMENT_PUBLIC_URL:-/chatmgt-api}/api/v1/chatbot/message"
        VITE_CHATBOT_WITH_CREDENTIALS: "true"
        VITE_CHATBOT_ID: ${VITE_CHATBOT_ID:-external-chatbot}
        VITE_CHATBOT_USERNAME: ${VITE_CHATBOT_USERNAME:-external_bot}
        VITE_CHATBOT_DISPLAY_NAME: ${VITE_CHATBOT_DISPLAY_NAME:-External AI}
        VITE_CHATBOT_DISPLAY_TITLE: ${VITE_CHATBOT_DISPLAY_TITLE:-External chatbot}
        VITE_CHATBOT_DISPLAY_ORGANIZATION: ${VITE_CHATBOT_DISPLAY_ORGANIZATION:-Connected service}
        VITE_CHATBOT_DISPLAY_AVATAR: ${VITE_CHATBOT_DISPLAY_AVATAR:-/favicon.svg}
        VITE_CHAT_MANAGEMENT_API_URL: ${CHAT_MANAGEMENT_PUBLIC_URL:-/chatmgt-api}
        VITE_CHAT_MANAGEMENT_REMOTE_AUTH: "true"
        VITE_CHAT_TENANT_ID: ${CHATMGT_DEFAULT_TENANT:-tn6913580727957397}
        VITE_CHAT_AUTH_MODE: ${VITE_CHAT_AUTH_MODE:-account_sso}
        VITE_CALLS_ENABLED: ${VITE_CALLS_ENABLED:-true}
        VITE_CHAT_MODE: ${VITE_CHAT_MODE:-internal}
    restart: unless-stopped
    depends_on:
      tinode-account-bridge:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  tinode_postgres_data:
  tinode_uploads:
  tinode_botdata:
  chatservice_postgres_data:
  chatservice_redis_data:
  tinode_chatbot_state:
