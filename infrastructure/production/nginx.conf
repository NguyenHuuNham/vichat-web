map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $request_uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(?:api|chatmgt-api|v0|tinode-media)/ "private, no-store";
    =/healthz "no-store";
    =/index.html "no-store, no-cache, must-revalidate";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Leave multipart overhead above the 500 MB ChatUI attachment limit.
    client_max_body_size 600m;

    # Keep browser hardening consistent across the SPA and proxied APIs.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://account.gonplatform.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://chatmgt.gonplatform.com https://s3.gonapp.net https://s3.upgo.vn https://account.gonplatform.com https://service.upgo.vn https://static.upgo.vn https://upstart.vn https://images.unsplash.com; media-src 'self' blob: https://chatmgt.gonplatform.com https://s3.gonapp.net https://s3.upgo.vn; connect-src 'self' https://account.gonplatform.com https://chat.gonplatform.com https://chatmgt.gonplatform.com https://chatapi.gonplatform.com https://s3.gonapp.net https://s3.upgo.vn wss://chat.gonplatform.com wss://chatapi.gonplatform.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control $cache_control always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }

    location = /index.html {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /chatmgt-api/ {
        proxy_pass http://chatmgt:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /chatmgt-api/api/v1/chat/maintenance/stream {
        proxy_pass http://chatmgt:8093/api/v1/chat/maintenance/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /tinode-media/ {
        proxy_pass https://chatapi.gonplatform.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name chatapi.gonplatform.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_set_header Host chatapi.gonplatform.com;
        proxy_set_header Origin https://chatapi.gonplatform.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Tinode Web basic login is translated through UpGO Account by the bridge.
    # Token logins from ChatUI pass through unchanged.
    location = /v0/channels {
        proxy_pass http://tinode-account-bridge:8095/v0/channels;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Vichat-Tinode-Internal $http_x_vichat_tinode_internal;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v0/ {
        proxy_pass https://chatapi.gonplatform.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name chatapi.gonplatform.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host chatapi.gonplatform.com;
        proxy_set_header Origin https://chatapi.gonplatform.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
